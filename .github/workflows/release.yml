name: Build Typst document
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: write
  pull-requests: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.set_version.outputs.release_version }}
      version_changed: ${{ steps.check_version.outputs.version_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine next version
        id: semver
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: "v"                         # The prefix to use to identify tags
          major_pattern: "/!:|BREAKING CHANGE:/"  # A string which, if present in a git commit, indicates that a change represents a major (breaking) change
          minor_pattern: "/feat(\\(.+\\))?:/"     # A string which, if present in a git commit, indicates that a change represents a minor (feature) change
          search_commit_body: true                # If true, the version will be determined using the latest tag that is reachable from the current commit
          change_path: "docs res"

      - name: Set the release version
        id: set_version
        shell: bash
        run: |
          echo "RELEASE_VERSION=v${{ steps.semver.outputs.version }}" >> $GITHUB_ENV
          echo "release_version=v${{ steps.semver.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Check if version has changed
        id: check_version
        shell: bash
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          echo "New version: ${{ env.RELEASE_VERSION }}"

          # Compare the latest tag with the new version
          if [ "$LATEST_TAG" = "${{ env.RELEASE_VERSION }}" ]; then
            echo "Version has not changed, skipping build and release"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          else
            echo "Version has changed, proceeding with build and release"
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --strip all --unreleased --tag ${{ env.RELEASE_VERSION }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload Changelog
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  build:
    needs: version
    if: needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    env:
      # Use only the fonts bundled in the repo so CI and local builds match
      TYPST_FONT_PATHS: res/fonts
      TYPST_IGNORE_SYSTEM_FONTS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true  # fonts in res/fonts are stored in Git LFS

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Build Lab Fondamentals
        run: |
          typst compile --root  ./  docs/01-homelab.typ     docs/DLS-DNC-NEC-01-homelab.pdf
          typst compile --root  ./  docs/02-mac_and_nat.typ docs/DLS-DNC-NEC-02-mac_and_nat.pdf
          typst compile --root  ./  docs/03-wifi.typ        docs/DLS-DNC-NEC-03-wifi.pdf

      - name: Build Lab IoT
        run: |
          typst compile --root  ./  docs/04-modbus_mqtt.typ docs/DLS-DNC-NEC-04-modbus_mqtt.pdf
          typst compile --root  ./  docs/05-security.typ    docs/DLS-DNC-NEC-05-security.pdf
          typst compile --root  ./  docs/06-vlan.typ        docs/DLS-DNC-NEC-06-vlan.pdf

      - name: Build Wireshark doc
        run: typst compile  --root  ./  docs/wireshark.typ  docs/DLS-DNC-NEC-Wireshark.pdf

      - name: Upload PDF file
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: PDFs
          path: '**/*.pdf'

  release:
    needs: [version, build]
    if: needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move build artifacts to expected location
        if: ${{ !env.ACT }}
        run: |
          mkdir -p output
          find artifacts -name "**.pdf" -type f -exec cp {} output/ \;

      - name: Create and push tag
        if: ${{ !env.ACT }}
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a ${{ env.RELEASE_VERSION }} -m "Release ${{ env.RELEASE_VERSION }}"
          git push origin ${{ env.RELEASE_VERSION }}

      - name: Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v1
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: "${{ env.RELEASE_VERSION }}"
          body_path: artifacts/changelog/CHANGELOG.md
          files: ./output/**.pdf
